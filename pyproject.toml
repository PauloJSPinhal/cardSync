[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cardsync"
version = "0.1.0"
description = "Gestor de arquivo e partilha fotográfica no Google Drive"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0",
    "exifread>=3.0",
    "requests>=2.30",
    "qrcode>=7.4",
    "google-api-python-client>=2.100",
    "google-auth>=2.20",
    "google-auth-oauthlib>=1.0",
]

[project.scripts]
cardsync = "cardsync.cli.__main__:main"
cardsync-gui = "cardsync.gui.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["cardsync*"]

[tool.pytest.ini_options]
testpaths = ["tests"]